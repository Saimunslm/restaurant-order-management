{% extends "base.html" %}

{% block title %}QR Code - Table {{ table.table_number }}{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4 safe-area-top">
    <div class="bg-white rounded-2xl shadow-xl p-6 max-w-sm w-full text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-1">Table {{ table.table_number }}</h1>
        <p class="text-gray-500 text-sm mb-6">Scan to order</p>

        <div class="flex justify-center mb-6">
            <div class="bg-white p-4 rounded-xl shadow-inner">
                <img src="data:image/svg+xml;base64,{{ qr_b64 }}" alt="QR Code" class="w-56 h-56">
            </div>
        </div>

        <p class="text-xs text-gray-400 break-all mb-6 bg-gray-50 p-2 rounded-lg">
            {{ table.qr_token[:20] }}...
        </p>

        <div class="flex gap-3">
            <button onclick="downloadQR()"
                class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-medium active:bg-blue-700 active:scale-95 transition-all">
                Download
            </button>
            <button onclick="window.print()"
                class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-xl font-medium active:bg-gray-300 active:scale-95 transition-all">
                Print
            </button>
        </div>
        
        <a href="/admin/tables"
            class="block mt-3 text-gray-500 text-sm py-2 active:text-gray-700">
            ← Back to Tables
        </a>
    </div>
</div>

<style>
    @media print {
        nav { display: none !important; }
        body { background: white !important; }
    }
</style>

<script>
function downloadQR() {
    const img = document.querySelector('img');
    const link = document.createElement('a');
    link.download = 'table-{{ table.table_number }}-qr.png';
    link.href = img.src;
    link.click();
}
</script>
{% endblock %}
