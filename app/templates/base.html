<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1f2937">
    <meta name="mobile-web-app-capable" content="yes">
    <title>{% block title %}QR Restaurant{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="manifest" href="/static/manifest.json">
    <style>
        [x-cloak] { display: none !important; }
        * { -webkit-tap-highlight-color: transparent; }
        input, textarea, select { font-size: 16px !important; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen overscroll-none">
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="fixed top-4 left-4 right-4 z-50 space-y-2">
        {% for category, message in messages %}
        <div class="px-4 py-3 rounded-lg shadow-lg text-white text-sm
            {% if category == 'success' %}bg-green-500
            {% elif category == 'error' %}bg-red-500
            {% else %}bg-blue-500{% endif %}"
            x-data="{ show: true }"
            x-init="setTimeout(() => show = false, 3000)"
            x-show="show"
            x-transition>
            {{ message }}
        </div>
        {% endfor %}
    </div>
    {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}

    <script>
    function buzz(pattern) {
        if (typeof navigator !== 'undefined' && typeof navigator.vibrate === 'function') {
            try { navigator.vibrate(pattern); } catch (e) {}
        }
    }

    var audioCtx = null;
    function playBeep() {
        try {
            if (!audioCtx) {
                var AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                audioCtx = new AC();
                document.addEventListener('pointerdown', function resume() {
                    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                    document.removeEventListener('pointerdown', resume);
                });
            }
            var schedule = function() {
                var now = audioCtx.currentTime;
                var beep = function(freq, at, dur) {
                    var osc = audioCtx.createOscillator();
                    var gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.3, at);
                    gain.gain.exponentialRampToValueAtTime(0.01, at + dur);
                    osc.start(at);
                    osc.stop(at + dur);
                };
                beep(880, now, 0.15);
                beep(880, now + 0.2, 0.15);
                beep(1100, now + 0.4, 0.3);
            };
            if (audioCtx.state === 'suspended') {
                audioCtx.resume().then(schedule);
            } else {
                schedule();
            }
        } catch (e) {}
    }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
